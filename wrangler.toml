name = "mixt-landing"
compatibility_date = "2024-10-01"
main = "./worker/index.js"

# Site statique servi depuis dist/. Le worker (worker/index.js) passe devant les pages
# pour les redirections canoniques (http/www → https://mixt.care, slash final en 301).
# Les assets lourds sont exclus : servis directement, sans invocation du worker.
# not_found_handling : cherche un 404.html dans dist/ (on en crée un via Astro)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/*", "!/_astro/*", "!/images/*", "!/fonts/*", "!/favicons/*"]
